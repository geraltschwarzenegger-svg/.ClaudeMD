<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="390" viewBox="0 0 1280 390" role="img" aria-labelledby="title desc"><title id="title">Настрой подачу под ситуацию</title><desc id="desc">Независимые настройки теплоты, юмора и напора. Команда определяет желаемую подачу.</desc><rect width="1280" height="390" rx="24" fill="#111622"/><text x="48" y="61" fill="#f5f4ef" font-family="Arial,sans-serif" font-size="28" font-weight="700">Один голос. Разная подача.</text><rect x="48" y="96" width="378" height="248" rx="16" fill="#1b2230"/><text x="72" y="132" fill="#b8dba8" font-family="Arial,sans-serif" font-size="15" font-weight="700">ПОДДЕРЖАТЬ</text><text x="72" y="165" fill="#f5f4ef" font-family="Arial,sans-serif" font-size="21">тепло, без советов</text><text x="72" y="210" fill="#b2bdd0" font-family="Arial,sans-serif" font-size="16">теплота</text><rect x="184" y="200" width="210" height="6" rx="3" fill="#343f52"/><rect x="184" y="200" width="189.0" height="6" rx="3" fill="#b8dba8"/><text x="72" y="253" fill="#b2bdd0" font-family="Arial,sans-serif" font-size="16">юмор</text><rect x="184" y="243" width="210" height="6" rx="3" fill="#343f52"/><rect x="184" y="243" width="21.0" height="6" rx="3" fill="#b8dba8"/><text x="72" y="296" fill="#b2bdd0" font-family="Arial,sans-serif" font-size="16">напор</text><rect x="184" y="286" width="210" height="6" rx="3" fill="#343f52"/><rect x="184" y="286" width="31.5" height="6" rx="3" fill="#b8dba8"/><rect x="450" y="96" width="378" height="248" rx="16" fill="#1b2230"/><text x="474" y="132" fill="#ffc986" font-family="Arial,sans-serif" font-size="15" font-weight="700">ПОДКОЛОТЬ</text><text x="474" y="165" fill="#f5f4ef" font-family="Arial,sans-serif" font-size="21">смешнее, по-дружески</text><text x="474" y="210" fill="#b2bdd0" font-family="Arial,sans-serif" font-size="16">теплота</text><rect x="586" y="200" width="210" height="6" rx="3" fill="#343f52"/><rect x="586" y="200" width="136.5" height="6" rx="3" fill="#ffc986"/><text x="474" y="253" fill="#b2bdd0" font-family="Arial,sans-serif" font-size="16">юмор</text><rect x="586" y="243" width="210" height="6" rx="3" fill="#343f52"/><rect x="586" y="243" width="189.0" height="6" rx="3" fill="#ffc986"/><text x="474" y="296" fill="#b2bdd0" font-family="Arial,sans-serif" font-size="16">напор</text><rect x="586" y="286" width="210" height="6" rx="3" fill="#343f52"/><rect x="586" y="286" width="94.5" height="6" rx="3" fill="#ffc986"/><rect x="852" y="96" width="378" height="248" rx="16" fill="#1b2230"/><text x="876" y="132" fill="#fa9393" font-family="Arial,sans-serif" font-size="15" font-weight="700">ОБОЗНАЧИТЬ ГРАНИЦУ</text><text x="876" y="165" fill="#f5f4ef" font-family="Arial,sans-serif" font-size="21">спокойно и уверенно</text><text x="876" y="210" fill="#b2bdd0" font-family="Arial,sans-serif" font-size="16">теплота</text><rect x="988" y="200" width="210" height="6" rx="3" fill="#343f52"/><rect x="988" y="200" width="52.5" height="6" rx="3" fill="#fa9393"/><text x="876" y="253" fill="#b2bdd0" font-family="Arial,sans-serif" font-size="16">юмор</text><rect x="988" y="243" width="210" height="6" rx="3" fill="#343f52"/><rect x="988" y="243" width="21.0" height="6" rx="3" fill="#fa9393"/><text x="876" y="296" fill="#b2bdd0" font-family="Arial,sans-serif" font-size="16">напор</text><rect x="988" y="286" width="210" height="6" rx="3" fill="#343f52"/><rect x="988" y="286" width="189.0" height="6" rx="3" fill="#fa9393"/></svg>