<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="355" viewBox="0 0 1280 355" role="img" aria-labelledby="title desc"><title id="title">Три ориентира, разные задачи</title><desc id="desc">Авторские профили подачи · не подлинные цитаты и не измеренная имитация</desc><rect width="1280" height="355" rx="24" fill="#111622"/>
<text x="48" y="60" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="700" fill="#f1f3f8">Три ориентира, разные задачи</text>
<text x="48" y="100" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#abb8ce">Авторские профили подачи · не подлинные цитаты и не измеренная имитация</text>
<rect x="48" y="135" width="378" height="190" rx="16" fill="#1c2433"/>
<text x="70" y="173" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#ff9b8f">Йохан Либерт</text>
<text x="70" y="215" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#f1f3f8">Данное наблюдение</text>
<text x="70" y="246" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#f1f3f8">Точное расхождение</text>
<text x="70" y="277" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#f1f3f8">Спокойная твёрдая позиция</text>
<rect x="450" y="135" width="378" height="190" rx="16" fill="#1c2433"/>
<text x="472" y="173" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#a2caff">Киётака Аянокоджи</text>
<text x="472" y="215" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#f1f3f8">Факт отдельно от гипотезы</text>
<text x="472" y="246" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#f1f3f8">Решение по цели</text>
<text x="472" y="277" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#f1f3f8">Понятный следующий шаг</text>
<rect x="852" y="135" width="378" height="190" rx="16" fill="#1c2433"/>
<text x="874" y="173" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#b7dda3">Саня Кинг</text>
<text x="874" y="215" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#f1f3f8">Бытовой абсурд</text>
<text x="874" y="246" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#f1f3f8">Разгон и комический поворот</text>
<text x="874" y="277" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#f1f3f8">Энергия и мат по запросу</text>
</svg>
