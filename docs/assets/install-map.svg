<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="355" viewBox="0 0 1280 355" role="img" aria-labelledby="title desc"><title id="title">Выбери способ подключения</title><desc id="desc">Поддержка инструкций и памяти зависит от конкретного продукта</desc><rect width="1280" height="355" rx="24" fill="#111622"/>
