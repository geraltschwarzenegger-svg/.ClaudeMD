<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="355" viewBox="0 0 1280 355" role="img" aria-labelledby="title desc"><title id="title">Что проверяет качество</title><desc id="desc">Разные уровни доказательств отвечают на разные вопросы</desc><rect width="1280" height="355" rx="24" fill="#111622"/>
<text x="48" y="60" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="700" fill="#f1f3f8">Что проверяет качество</text>
<text x="48" y="100" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#abb8ce">Разные уровни доказательств отвечают на разные вопросы</text>
<rect x="48" y="135" width="378" height="190" rx="16" fill="#1c2433"/>
<text x="70" y="173" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#ff9b8f">Структура</text>
<text x="70" y="215" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#f1f3f8">30 unit-тестов</text>
<text x="70" y="246" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#f1f3f8">Ссылки, YAML, XML, ZIP</text>
<text x="70" y="277" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#f1f3f8">Это не оценка естественности</text>
<rect x="450" y="135" width="378" height="190" rx="16" fill="#1c2433"/>
<text x="472" y="173" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#a2caff">Авторские пробы</text>
<text x="472" y="215" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#f1f3f8">24 текста текущего rc.2</text>
<text x="472" y="246" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#f1f3f8">12 пар: 2.2.0 и 3.0</text>
<text x="472" y="277" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#f1f3f8">Автор видит свои критерии</text>
<rect x="852" y="135" width="378" height="190" rx="16" fill="#1c2433"/>
<text x="874" y="173" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="700" fill="#b7dda3">Что ещё нужно</text>
<text x="874" y="215" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#f1f3f8">Независимые запуски</text>
<text x="874" y="246" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#f1f3f8">Слепой выбор пользователя</text>
<text x="874" y="277" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#f1f3f8">Нет измеренного победителя</text>
</svg>
